model:
  base_learning_rate: 4.5e-06
  target: model.autoencoder_contiguously.VQModel
  params:
    embed_dim: 3
    n_embed: 8192
    monitor: val/rec_loss

    ddconfig:
      double_z: false
      z_channels: 3
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult:
      - 1
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0
    lossconfig:
      target: model.losses.vqperceptual_contiguously.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_start: 0
        disc_weight: 0.75
        codebook_weight: 1.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 64
    num_workers: 8
    wrap: true
    train:
      target: dataset.custom.CustomTrain
      params:
        training_images_list_file: data/train.txt
        size: 32
    validation:
      target: dataset.custom.CustomTest
      params:
        test_images_list_file: data/test.txt
        size: 32
